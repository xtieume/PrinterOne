<!DOCTYPE html>
<html><head><title>PrinterOne - status</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/modern.css"></head><body><div id="app"><h1>PrinterOne</h1><nav><a href="/">Status</a> | <a href="/printers">Printers</a> | <a href="/test">Test</a> | <a href="/log">Log</a> | <a href="/settings">Settings</a></nav>
<h2>Status</h2><p>UI: <a href="{{.UIURL}}">{{.UIURL}}</a></p><p>Log: {{.LogPath}}</p><table data-status><tr><th>Name</th><th>Windows printer</th><th>Port</th><th>Allow</th><th>Jobs today</th><th>Last result</th></tr>{{range .Printers}}<tr><td>{{.Name}}</td><td>{{.Printer}}</td><td>{{.Port}}</td><td>{{.Allow}}</td><td>{{.Jobs}}</td><td>{{.Last}}</td></tr>{{end}}</table><script type="module" src="/app.js"></script></div></body></html>
