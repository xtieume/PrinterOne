<!DOCTYPE html>
<html><head><title>PrinterOne - settings</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/modern.css"></head><body><div id="app"><h1>PrinterOne</h1><nav><a href="/">Status</a> | <a href="/printers">Printers</a> | <a href="/test">Test</a> | <a href="/log">Log</a> | <a href="/settings">Settings</a></nav>
<h2>Settings</h2>{{if .Error}}<p class="error">{{.Error}}</p><span class="error" data-field="{{.Field}}">{{.Error}}</span>{{end}}{{if eq .Field "ui.port"}}<span class="error" data-field="ui.port">{{.Error}}</span>{{end}}<form method="post" action="/settings"><input type="hidden" name="token" value="{{.Token}}"><label>Log folder <input name="log_dir" value="{{if index .Inputs "log_dir"}}{{index .Inputs "log_dir"}}{{else}}{{.LogDir}}{{end}}"></label><label>Keep days <input name="keep_days" value="{{if index .Inputs "keep_days"}}{{index .Inputs "keep_days"}}{{else}}{{.KeepDays}}{{end}}"></label>{{if eq .Field "log.keep_days"}}<span class="error" data-field="log.keep_days">{{.Error}}</span>{{end}}<label>UI port <input name="ui_port" value="{{if index .Inputs "ui_port"}}{{index .Inputs "ui_port"}}{{else}}{{.UIPort}}{{end}}"></label><label>Remote <input type="checkbox" name="remote" value="on" {{if index .Inputs "remote"}}checked{{else}}{{if .Remote}}checked{{end}}{{end}}></label><label>Password <input type="password" name="password" value=""></label><p>Password is never shown. Leave blank to keep it.</p><button type="submit">Save settings</button></form><script type="module" src="/app.js"></script></div></body></html>
